services:
  - type: web
    name: mini-jira
    runtime: python
    region: oregon
    plan: free
    rootDir: services/combined
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: mini-jira-db
          property: connectionString

databases:
  - name: mini-jira-db
    region: oregon
    plan: free
